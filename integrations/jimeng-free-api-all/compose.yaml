name: merchroute-jimeng
services:
  jimeng:
    image: ${JIMENG_IMAGE:?Use the verified immutable image ID from the build record}
    container_name: merchroute-jimeng-v${JIMENG_RELEASE_VERSION:?Use the accepted MerchRoute release version}
    labels:
      org.merchroute.product.version: ${JIMENG_RELEASE_VERSION:?Use the accepted MerchRoute release version}
      org.opencontainers.image.version: ${JIMENG_RELEASE_VERSION:?Use the accepted MerchRoute release version}
    user: node
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      IMAGE_TASK_STORE_DIR: /app/data
    volumes:
      - jimeng-image-task-store:/app/data

volumes:
  jimeng-image-task-store:
    name: ${JIMENG_TASK_VOLUME:?Explicit existing Jimeng task volume is required}
    external: true
